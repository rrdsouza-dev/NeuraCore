[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuracore"
version = "0.1.0"
description = "Extensible local AI inference infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "NeuraCore contributors"}]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "nvidia-ml-py>=12.535",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "rich>=13.7",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["neuracore*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["neuracore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=neuracore --cov-report=term-missing"

[project.scripts]
neuracore = "neuracore.cli.commands:app"

